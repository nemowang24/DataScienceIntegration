<!DOCTYPE html>
<html>
<head>
    <title>Real-time Centroid Calculation</title>
    <script src="https://cdn.jsdelivr.net/npm/meyda/dist/web/meyda.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/regression/dist/regression.min.js"></script>
    <style>
        .big-red {
            font-size: 2em;
            color: red;
        }
    </style>

</head>
<body>
<hr>
<h1>Real-Time MFCC Calculation</h1>

<!-- Element to display MFCC output -->
<p><strong>detector status:</strong></p>
<div id="mfcc-output"></div>


<!-- Button to start microphone input -->
<button id="start-button">Start MFCC Calculation</button>
<hr>
<div id="mfcc-debug"></div>

<script>
    // Import regression-js
    const regression = window.regression;

    // Perform linear regression on SpectralCentroid
    function performLinearRegression(dataList) {
        // Prepare data for regression (x, y) pairs.
        // Assume x as the index and y as the smoothed spectral centroid values.
        const data = dataList.map((value, index) => [index, value]);

        // Perform linear regression
        const result = regression.linear(data);

        // Output results
        console.log('Linear regression equation:', result.string);
        console.log('R-squared value:', result.r2);

        // Return result
        return result;
    }

    function playBeep() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Create an oscillator
        const oscillator = audioCtx.createOscillator();
        oscillator.type = 'sine'; // Sine wave for a simple beep
        oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // Frequency in Hz (440 is the A note)

        // Create a gain node to control the volume
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.02, audioCtx.currentTime); // Low volume

        // Connect oscillator -> gain -> speakers
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        // Play the sound for a short duration
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.2); // Play for 0.2 seconds
    }


    detector_status = 0

    document.getElementById('start-button').addEventListener('click', async function () {

        detector_status = '1'

        // Request audio from the user's microphone
        const stream = await navigator.mediaDevices.getUserMedia({audio: true});

        // Set up Web Audio Context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)(
                {
                    audio:
                        {
                            noiseSuppression: false
                        }
                }
            )
        ;
        const sampleRate = audioContext.sampleRate; // Get sample rate
        const source = audioContext.createMediaStreamSource(stream);

        // Buffer to store the last 50 spectralCentroidInHz values
        const spectralCentroidBuffer = [];
        const bufferSize_sc = Math.round(sampleRate / 512 * 40); // Size of the spectralCentroidBuffer window
        let counter = 0;


        const smoothedRMSList = [];
        const bufferSize_rms = 500;

        const rms_threshold = 0.001

        const regressionList = [];
        const bufferSize_regression = 1000;

        // Create Meyda analyzer
        const analyzer = Meyda.createMeydaAnalyzer({
            audioContext: audioContext,
            source: source,
            bufferSize: 512, // Buffer size for real-time analysis
            featureExtractors: ['spectralCentroid', 'rms'], // Includes spectralCentroid
            callback: (features) => {
                // Normalize spectralCentroid to Hz
                const spectralCentroidInHz = features.spectralCentroid
                    ? features.spectralCentroid / (512 / 2) * (sampleRate / 2) // Convert to Hz
                    : null;

                const rms = features.rms ? features.rms : null;
                if (rms !== null) {
                    // Add RMS value to smoothedRMSList
                    smoothedRMSList.push(rms);

                    // Ensure the list only holds the last 100 elements
                    if (smoothedRMSList.length > bufferSize_rms) {
                        smoothedRMSList.shift();
                    }
                }
                // Calculate the mean RMS
                const meanRMS =
                    smoothedRMSList.length >= bufferSize_rms
                        ? smoothedRMSList.reduce((a, b) => a + b, 0) / smoothedRMSList.length
                        : null;

                // Smooth the spectralCentroidInHz with a rolling average
                if (spectralCentroidInHz !== null && meanRMS > rms_threshold) {
                    // Add current value to the buffer
                    spectralCentroidBuffer.push(spectralCentroidInHz);

                    // If buffer exceeds the window size, remove the oldest value
                    if (spectralCentroidBuffer.length > bufferSize_sc) {
                        spectralCentroidBuffer.shift();
                    }
                }

                const regression_raw =
                    meanRMS != null && spectralCentroidBuffer.length >= bufferSize_sc
                        ? performLinearRegression(spectralCentroidBuffer)    // [slope, intercept]
                        : null;
                const regression =
                    regression_raw != null && regression_raw.equation[0] < 1
                        ? regression_raw
                        : null;
                if (regression !== null) {
                    // Add current value to the buffer
                    regressionList.push(regressionList[0]);

                    // If buffer exceeds the window size, remove the oldest value
                    if (regressionList.length > bufferSize_regression) {
                        regressionList.shift();
                    }
                }


                if (detector_status == '1') {
                    document.getElementById('mfcc-output').innerText = `Try to detect heating\nsmoothedRMSList.length: ${smoothedRMSList.length}\n`;
                    if (smoothedRMSList.length >= bufferSize_rms) {
                        detector_status = '1.1'
                    }
                } else if (detector_status == '1.1') {
                    document.getElementById('mfcc-output').innerText = `Try to detect heating\nspectralCentroidBuffer.length: ${spectralCentroidBuffer.length}\n`;
                    if (spectralCentroidBuffer.length >= bufferSize_sc) {
                        detector_status = '1.2'
                    }
                } else if (detector_status == '1.2') {

                    if (meanRMS >= rms_threshold) {
                        if (regression && regression.equation[0] > -0.1) {
                            document.getElementById('mfcc-output').innerText = `Try to detect heating\nrms${meanRMS}\nslope${regression.equation[0]}\n`;
                        } else {
                            detector_status = '2'
                        }
                    }
                } else if (detector_status == '2') {
                    document.getElementById('mfcc-output').innerText = `Try to detect boiling\nrms${meanRMS}\nslope${regression.equation[0]}${regression.equation[1]}\n`;
                    if (regression.equation[0] > 0.06) {
                        detector_status = '3'

                        setTimeout(() => {
                            detector_status = '4'; // Update status after time is up
                        }, 3 * 60 * 1000); // Set timer for 3 minutes
                    }
                } else if (detector_status == '3') {
                    document.getElementById('mfcc-output').innerText = `Boiling detected, timing 3 minutes\n`;

                } else if (detector_status == '4') {
                    document.getElementById('mfcc-output').innerText = `Time up, Water is ready\n`;
                    playBeep();
                }

                document.getElementById('mfcc-debug').innerText = `detector_status: ${detector_status}\n`;
            },
        });


        // Start the analyzer
        analyzer.start();
    });
</script>
</body>
</html>
