{% extends "helldivers/base.html" %}

{% block myscripts %}
    <script>
        // A helper function to ensure a safe string in case the field is empty
        function sanitizeValue(rawValue) {
            return (rawValue && rawValue.trim() !== '') ? rawValue : '(none)';
        }

        function callAPI() {
            // Gather the input values
            const input1Raw = document.getElementById('input1').value;
            const input1Val = input1Raw && input1Raw.trim() !== '' ? input1Raw : '1024x1024';
            const input2Raw = document.getElementById('input2').value;
            const input2Val = input2Raw && input2Raw.trim() !== '' ? input2Raw : 'high';

            const data = {
                input1: input1Val,
                input2: input2Val,
                input3: sanitizeValue(document.getElementById('input3').value),
                input4: sanitizeValue(document.getElementById('input4').value),
            };


            doImageGen(data)
        }

        function getCsrfToken() {
            return document.querySelector('meta[name="csrf-token"]').getAttribute('content')
        }

        async function doImageGen(value) {
            try {

                const csrfToken = getCsrfToken();


                const response = await fetch('/api/prompt/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken, // Add the CSRF token here
                    },
                    body: JSON.stringify({counterValue: value}),
                });

                // Handle server response
                if (response.ok) {
                    const result = await response.json();
                    const resultElement = document.getElementById('apiResult');
                    resultElement.textContent = JSON.stringify(result, null, 2);

                    console.log(data.message);
                } else {
                    console.error('API request failed:', response.status);
                }

            } catch (error) {
                console.error('Error occurred while sending API request:', error);
            }
        }
    </script>
{% endblock myscripts %}

{% block myvideo %}
    <form onsubmit="event.preventDefault(); callAPI();">
        <label for="input1">resolution:</label><br>
        <select id="input1" name="input1">
            <option value="1024x1024" title="Square format" selected>1024x1024 (square)</option>
            <option value="1024x1536" title="Portrait format">1024x1536 (portrait)</option>
            <option value="1536x1024" title="Landscape format">1536x1024 (landscape)</option>
        </select><br><br>

        <label for="input2">quality:</label><br>
        <select id="input2" name="input2">
            <option value="low" title="Generates images quickly with minimal detail">low: Generates images quickly with minimal detail</option>
            <option value="medium" title="Balances image quality and generation speed">medium: Balances image quality and generation speed</option>
            <option value="high" title="Produces detailed images with longer generation times" selected>high: Produces detailed images with longer generation times</option>
        </select><br><br>

        <label for="input3">prompt</label><br>
        <textarea id="input3" name="input3" rows="6" cols="50" style="width: 100%; max-width: 600px; resize: vertical;"></textarea><br><br>

        <label for="input4">notes</label><br>
        <textarea id="input4" name="input4" rows="4" cols="50" style="width: 100%; max-width: 600px; resize: vertical;"></textarea><br><br>


        <button type="submit">Submit</button>
    </form>

    <!-- A container to display API response -->
    <h3>API Result:</h3>
    <pre id="apiResult"></pre>
{% endblock myvideo %}
